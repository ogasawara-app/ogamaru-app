name: Update Ogasawara Maru Schedule

on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '*/10 0-8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Fetch official schedule & notify if changed
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python3 ogamaru_updater.py

      - name: Commit updated schedule_data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f schedule_data.json ] && git add schedule_data.json
          [ -f schedule_history.csv ] && git add schedule_history.csv
          git diff --staged --quiet || git commit -m "Update Ogasawara Maru schedule data"
          git push
